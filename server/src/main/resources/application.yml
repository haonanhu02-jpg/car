# ==========================================
# 万盛股份 · 车辆管理系统 — 联调配置
# ==========================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: vehicle-management

  # 联调阶段使用 H2 内存数据库（无需安装 MySQL）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:vehicle_management;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  # H2 Web 控制台（调试用）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 启动时初始化数据
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wansheng.vehicle.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: ${JWT_SECRET:wansheng-vehicle-management-jwt-secret-key-2024}
  expiration: 86400000  # 24小时

# Knife4j API 文档
springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

# 日志
logging:
  level:
    com.wansheng.vehicle: debug
    org.springframework.security: info
