# ==========================================
# 万盛股份 · 车辆管理系统 — 联调配置
# ==========================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: vehicle-management

  # 联调阶段使用 H2 内存数据库（无需安装 MySQL）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:vehicle_management;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  # H2 Web 控制台（调试用）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 启动时初始化数据
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 腾讯企业邮箱 SMTP。专属密码只从服务器环境变量读取，禁止写入代码仓库。
  mail:
    host: ${MAIL_HOST:smtp.exmail.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_FROM:zhongzhenggen@ws-chem.com}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        debug: false

app:
  mail:
    from: ${MAIL_FROM:zhongzhenggen@ws-chem.com}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wansheng.vehicle.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LWp3dC1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0yMDI0}
  expiration: 86400000  # 24小时

# Knife4j API 文档
springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

# 日志
logging:
  level:
    com.wansheng.vehicle: debug
    org.springframework.security: info
