services:
  mysql:
    image: mysql:8.0
    container_name: vehicle-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=wansheng123
      - MYSQL_DATABASE=vehicle_management
      - TZ=Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./server
    container_name: vehicle-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLWRldi1vbmx5LWp3dC1zZWNyZXQta2V5LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0yMDI0}
      - MYSQL_ROOT_PASSWORD=wansheng123
      - MAIL_HOST=${MAIL_HOST:-smtp.exmail.qq.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_FROM=${MAIL_FROM:-zhongzhenggen@ws-chem.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./client
    container_name: vehicle-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
