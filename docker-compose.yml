services:
  backend:
    build: ./server
    container_name: vehicle-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./client
    container_name: vehicle-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
